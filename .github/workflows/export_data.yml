# ============================================================
# export_data.yml — 一次性数据导出
# 用途：从 Supabase 导出 7 张表为 JSON 并提交到 data-export/ 目录，
#       供本机拉取后导入飞书多维表格（因本机到 supabase.co 的 SNI 被阻断）。
# 触发：push 本文件 或 Actions 页面手动 Run workflow。
# 诊断：无论成败都把 HTTP 码/行数/响应头部写入 data-export/_diag.txt 并提交。
# 完成后：本机 git pull 拉取 data-export/*.json，导入后删除本 workflow 与目录。
# ============================================================
name: Export Supabase Data

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/export_data.yml'

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Export all tables
        env:
          SUPABASE_URL: https://xnxmzgmgmfesrathfnnl.supabase.co
          # anon key 本就公开在前端代码中（app/src/lib/supabase.ts），非敏感
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhueG16Z21nbWZlc3JhdGhmbm5sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQwMTE4OTAsImV4cCI6MjA5OTU4Nzg5MH0.PHLXOelFFqk8ugweQTgJgbHs4aKye9sQZHshJHJQ0R8
        run: |
          mkdir -p data-export
          DIAG=data-export/_diag.txt
          echo "=== $(date -u) 导出诊断 ===" > "$DIAG"
          FAIL=0
          for t in projects downstreams contracts downstream_contracts memos todos change_log; do
            code=$(curl -sS -o "data-export/$t.json" -w "%{http_code}" --retry 3 --retry-delay 2 \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
              "$SUPABASE_URL/rest/v1/$t?select=*&limit=100000" 2>/dev/null)
            n=$(jq 'length' "data-export/$t.json" 2>/dev/null || echo "NA")
            first=$(head -c 80 "data-export/$t.json" | tr '\n' ' ')
            echo "$t: HTTP=$code rows=$n first=[$first]" >> "$DIAG"
            if [ "$code" != "200" ] || ! head -c 1 "data-export/$t.json" 2>/dev/null | grep -q '['; then
              echo "  !! $t 导出异常（可能 RLS 未放通 anon 读，需在 Supabase 跑 rls_anon_read.sql）" >> "$DIAG"
              FAIL=1
            else
              min=0
              case $t in projects) min=50;; downstreams) min=150;; esac
              if [ "$n" != "NA" ] && [ "$n" -lt "$min" ] 2>/dev/null; then
                echo "  !! $t 行数 $n 低于下限 $min" >> "$DIAG"
                FAIL=1
              fi
            fi
          done
          cat "$DIAG"

      - name: Commit and push data (incl. diagnostics)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data-export/
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore(data-export): supabase 全表导出 $(date +%Y%m%d-%H%M%S)"
            git push
          fi
