name: Keep Supabase awake

# 目的：Supabase 免费项目若约 7 天无 API 请求会被自动暂停（Pause），
# 暂停后网站与登录全部失效。本工作流每 5 天（留 2 天余量）自动向 Supabase
# 发起一次轻量 REST 请求，使项目保持活跃、不再被暂停。
# 运行在 GitHub 服务器（能直连 supabase.co，无需本机代理/开机）。

on:
  schedule:
    # 每 5 天 UTC 03:07 触发（避开整点高峰）
    - cron: '7 3 */5 * *'
  workflow_dispatch: {}   # 允许在 Actions 页面手动点 "Run workflow" 触发

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API (keep project active)
        env:
          SUPABASE_URL: https://xnxmzgmgmfesrathfnnl.supabase.co
          # anon key 本就公开在前端代码中，非敏感信息，此处直接使用
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhueG16Z21nbWZlc3JhdGhmbm5sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQwMTE4OTAsImV4cCI6MjA5OTU4Nzg5MH0.PHLXOelFFqk8ugweQTgJgbHs4aKye9sQZHshJHJQ0R8
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/projects?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Supabase ping -> HTTP $code"
          if [ "$code" = "200" ]; then
            echo "OK: project is active"
          else
            echo "WARN: unexpected status $code (project may be paused or credentials changed)"
            exit 1
          fi
