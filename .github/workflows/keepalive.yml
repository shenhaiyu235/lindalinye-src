name: Keep Supabase awake

# ============================================================================
#  ⚠️  请勿删除本文件
# ----------------------------------------------------------------------------
#  本工作流负责定时"唤醒" Supabase 免费项目。
#  Supabase 免费版约 7 天无 API 活动会被自动暂停（Pause），暂停后项目专属
#  域名（xxxx.supabase.co）的 DNS 记录会被移除，网站与登录全部失效。
#
#  【历史事故】2026-08-12 的提交 5769d8f 在清理一次性导出 workflow 时，把本
#  文件一并删除（提交信息中未提及），导致项目于 8/8 前后被暂停、网站长期无法
#  登录，直到 9/17 才定位到根因。
#  => 调整 workflow 时请逐个文件确认，切勿批量删除。
# ============================================================================

on:
  schedule:
    # 每周一 / 三 / 五 触发（UTC 03:07，避开整点高峰，对应北京时间 11:07）
    #
    # 为什么不是原来的"每 5 天一次"：
    #   原方案 `7 3 */5 * *` 距 7 天暂停阈值仅剩 2 天余量，而 GitHub 的定时任务
    #   在平台负载高时会被延迟、甚至直接跳过（官方已知行为）。跳一次即可能叠加
    #   超期。改为每周 3 次后，任何一次失败/跳过都有 1~2 天内的后续触发兜底。
    - cron: '7 3 * * 1,3,5'
  workflow_dispatch: {}   # 支持在 Actions 页手动 "Run workflow"，便于随时人工验证

permissions:
  contents: write   # 需写权限以提交心跳文件（留存保活证据 + 维持仓库活跃）

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ping Supabase REST API (with retry)
        id: ping
        env:
          SUPABASE_URL: https://xnxmzgmgmfesrathfnnl.supabase.co
          # anon key 本就公开在前端代码中，非敏感信息，此处直接使用
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhueG16Z21nbWZlc3JhdGhmbm5sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQwMTE4OTAsImV4cCI6MjA5OTU4Nzg5MH0.PHLXOelFFqk8ugweQTgJgbHs4aKye9sQZHshJHJQ0R8
        run: |
          ok=0
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 25 \
              "$SUPABASE_URL/rest/v1/projects?select=id&limit=1" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY" || echo "000")
            echo "第 $i 次尝试 -> HTTP $code"
            if [ "$code" = "200" ]; then ok=1; break; fi
            if [ "$i" -lt 3 ]; then sleep 15; fi
          done
          if [ "$ok" = "1" ]; then
            echo "status=OK" >> "$GITHUB_OUTPUT"
            echo "✅ Supabase 项目活跃（保活成功）"
          else
            echo "status=FAIL" >> "$GITHUB_OUTPUT"
            echo "::error::Supabase 保活失败 —— 项目可能已被暂停，或域名/凭据变更。请立即打开 https://supabase.com/dashboard/project/xnxmzgmgmfesrathfnnl 检查并按需 Restore。"
            exit 1
          fi

      - name: Update heartbeat file
        if: always()
        run: |
          mkdir -p .keepalive
          printf '%s | status=%s | run=%s\n' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "${{ steps.ping.outputs.status || 'UNKNOWN' }}" \
            "${{ github.run_number }}" > .keepalive/status.txt
          cat .keepalive/status.txt

      - name: Commit heartbeat
        if: always()
        run: |
          git config user.name  "keepalive-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .keepalive/status.txt
          if git diff --staged --quiet; then
            echo "心跳无变化，跳过提交"
          else
            git commit -m "chore(keepalive): ${{ steps.ping.outputs.status || 'UNKNOWN' }} @ $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push || (git pull --rebase --autostash && git push)
          fi
